{% extends 'base_auth.html' %}

{% block title %}Página não encontrada{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light px-3">

    <div class="text-center" style="max-width: 420px;">

        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-4"
             style="width: 88px; height: 88px;">
            <i class="bi bi-signpost-split fs-1"></i>
        </div>

        <h1 class="display-5 fw-bold mb-2">404</h1>
        <h2 class="h5 fw-semibold mb-3">Página não encontrada</h2>
        <p class="text-muted mb-4">
            A página que procuras não existe, foi movida, ou o link que usaste está incorreto.
        </p>

        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
            <a href="/" class="btn btn-primary">
                <i class="bi bi-house-door-fill"></i> Voltar ao início
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Página anterior
            </a>
        </div>

    </div>

</div>
{% endblock %}
